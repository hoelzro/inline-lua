name: linux

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    branches: [ '*' ]

jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        perl-version:
        # In buster we can't install lua
#        - 5.8-buster
#        - ...
#        - 5.28-buster
        - 5.30-bullseye
        - 5.32-bullseye
        - 5.34-bullseye
        - 5.36-bookworm
        - 5.38-bookworm
        - 5.40-bookworm
        - latest

    container:
      image: perl:${{ matrix.perl-version }}

    steps:
    - uses: actions/checkout@v3
    - run: env | sort
    - run: perl -V
    - name: Install deps
      run: |
        apt-get update && apt-get install -y liblua5.4-dev lua5.4

        cpanm --quiet --notest Inline Test::Exception
    - name: Run Tests
      run: |
        perl Makefile.PL
        make test

